[project]
name = "bug-severity-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lilymonroebloom-creator", email = "lily.monroe.bloom@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
bug-severity-classifier = "bug_severity_classifier:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
